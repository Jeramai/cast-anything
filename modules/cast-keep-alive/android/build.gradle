plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.castkeepalive'
version = '0.1.0'

android {
  namespace "expo.modules.castkeepalive"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // MediaSessionCompat + MediaStyle notification (transport controls + seek bar).
  implementation "androidx.media:media:1.7.0"
}
