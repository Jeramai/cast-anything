plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.casttranscoder'
version = '0.1.0'

android {
  namespace "expo.modules.casttranscoder"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Zero-copy MediaCodec surface-to-surface transcoder (decode Surface → GPU scale →
  // encode Surface). Pure JVM (no bundled .so), so no 16KB-page-alignment concern.
  implementation "io.deepmedia.community:transcoder-android:0.11.2"
}
