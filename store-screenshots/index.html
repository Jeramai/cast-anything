<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cast Anything — Play Store screenshots</title>
    <style>
      /* ---------------------------------------------------------------
         Cast Anything — Google Play phone screenshot generator.
         Each .slide is an exact 1080×1920 (9:16) Play phone asset.
         Design tokens mirror the real app theme (dark base + blue accent).
         Open in a browser to preview; render.mjs rasterizes each slide to
         a PNG in ./out. Edit SLIDES below (copy / layout) to taste.
      --------------------------------------------------------------- */
      :root {
        --bg-0: #070a11;
        --bg-1: #0d1320;
        --ink: #f5f8fe;
        --ink-dim: #94a3b8;
        --accent: #4f8cff; /* app default accent (Blue) */
        --frame: #04060a;
        --w: 1080px;
        --h: 1920px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #04060a; }
      body {
        font-family: "Helvetica Neue", "Inter", "Segoe UI", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-wrap: wrap;
        gap: 40px;
        padding: 40px;
        justify-content: center;
      }

      .slide {
        position: relative;
        width: var(--w);
        height: var(--h);
        overflow: hidden;
        background:
          radial-gradient(1250px 900px at var(--glow-x, 50%) -8%, rgba(79, 140, 255, 0.30), transparent 62%),
          linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 68%);
        color: var(--ink);
        flex: 0 0 auto;
      }
      /* faint accent hairline sweeping the top, adds depth */
      .slide::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, rgba(79, 140, 255, 0.55), transparent);
        opacity: 0.6;
      }

      .copy {
        position: absolute;
        top: 116px;
        left: 92px;
        right: 92px;
        z-index: 3;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 40px;
      }
      .brand img {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      .brand span {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #dbe6f7;
      }
      .eyebrow {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 26px;
      }
      h1 {
        font-size: 94px;
        font-weight: 800;
        line-height: 1.03;
        letter-spacing: -2px;
        white-space: pre-line;
        color: var(--ink);
        text-shadow: 0 2px 30px rgba(0, 0, 0, 0.35);
      }
      .sub {
        margin-top: 30px;
        font-size: 41px;
        font-weight: 500;
        line-height: 1.32;
        color: var(--ink-dim);
        max-width: 800px;
      }

      /* --- Android phone mockup (pure CSS, no asset) --- */
      .phone {
        position: absolute;
        bottom: 48px;
        left: 50%;
        width: 538px; /* frame outer width (screen ≈ 510) */
        padding: 14px;
        background: var(--frame);
        border-radius: 52px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.06),
          0 44px 120px rgba(0, 0, 0, 0.62),
          0 24px 80px rgba(79, 140, 255, 0.16);
        z-index: 2;
      }
      .phone .screen {
        border-radius: 40px;
        overflow: hidden;
        line-height: 0;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }
      .phone .screen img {
        width: 100%;
        height: auto;
        display: block;
      }

      .layout-center { transform: translateX(-50%); --glow-x: 50%; }
      .layout-right  { transform: translateX(calc(-50% + 64px)) rotate(-2.5deg); }
      .layout-left   { transform: translateX(calc(-50% - 64px)) rotate(2.5deg); }
      .slide.right { --glow-x: 72%; }
      .slide.left  { --glow-x: 28%; }

      /* --- Isolation mode for pixel-exact PNG export (render.mjs / #shot-N) --- */
      body.shot { padding: 0; gap: 0; background: transparent; display: block; }
      body.shot .slide { display: none; }
      body.shot .slide.target { display: block; position: fixed; top: 0; left: 0; }

      .caption {
        position: absolute;
        top: -34px;
        left: 0;
        font: 600 22px/1 "Helvetica Neue", Arial, sans-serif;
        color: #6b7688;
      }
      .frame-wrap { position: relative; }
    </style>
  </head>
  <body>
    <div id="deck"></div>

    <script>
      const SLIDES = [
        {
          id: 1,
          brand: true,
          eyebrow: "Cast to any TV",
          headline: "Your phone.\nYour TV.\nNo cables.",
          sub: "Cast video, music & photos to any TV on your Wi‑Fi. No Chromecast required.",
          shot: "./shots/01-hero.png",
          layout: "center",
        },
        {
          id: 2,
          eyebrow: "Full control",
          headline: "A full remote,\nin your pocket.",
          sub: "Play, pause, skip and seek — with volume — right from your phone. Even screen‑off.",
          shot: "./shots/02-nowplaying.png",
          layout: "right",
        },
        {
          id: 3,
          eyebrow: "Convert",
          headline: "Any file plays.\nWe convert it.",
          sub: "HEVC, MKV, 4K — transcoded on‑device into something your TV can actually play.",
          shot: "./shots/03-convert.png",
          layout: "left",
        },
        {
          id: 4,
          eyebrow: "Subtitles",
          headline: "Subtitles,\nsorted.",
          sub: "Attach your own .srt, or search thousands online in seven languages.",
          shot: "./shots/04-subs.png",
          layout: "center",
        },
        {
          id: 5,
          eyebrow: "Queue",
          headline: "Line up\nthe whole night.",
          sub: "Build a playlist. Shuffle, repeat and auto‑play across the room.",
          shot: "./shots/05-queue.png",
          layout: "right",
        },
        {
          id: 6,
          eyebrow: "Make it yours",
          headline: "Themes for\nevery mood.",
          sub: "16 accent colors, light · dark · AMOLED, and swappable app icons.",
          shot: "./shots/06-themes.png",
          layout: "left",
        },
      ];

      function slideHTML(s) {
        return `
          <div class="frame-wrap">
            <div class="caption">Slide ${s.id} · 1080×1920</div>
            <section class="slide ${s.layout}" id="shot-${s.id}" data-id="${s.id}">
              <div class="copy">
                ${s.brand ? `<div class="brand"><img src="./shots/app-icon.png" alt=""><span>Cast Anything</span></div>` : ""}
                <div class="eyebrow">${s.eyebrow}</div>
                <h1>${s.headline}</h1>
                <div class="sub">${s.sub}</div>
              </div>
              <div class="phone layout-${s.layout}">
                <div class="screen"><img src="${s.shot}" alt=""></div>
              </div>
            </section>
          </div>`;
      }

      document.getElementById("deck").innerHTML = SLIDES.map(slideHTML).join("");

      // #shot-N → isolate that slide full-viewport for a pixel-exact 1080×1920 grab.
      function applyHash() {
        const m = location.hash.match(/shot-(\d+)/);
        document.querySelectorAll(".slide").forEach((el) => el.classList.remove("target"));
        if (m) {
          document.body.classList.add("shot");
          const el = document.getElementById("shot-" + m[1]);
          if (el) el.classList.add("target");
        } else {
          document.body.classList.remove("shot");
        }
      }
      window.addEventListener("hashchange", applyHash);
      applyHash();
    </script>
  </body>
</html>
