<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cast Anything — Play feature graphic</title>
    <style>
      /* Google Play feature graphic. Authored at 1024×500; render at 2× and
         downscale to exactly 1024×500 (supersampled) for crisp text. No alpha. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1024px; height: 500px; overflow: hidden; }
      .fg {
        position: relative;
        width: 1024px;
        height: 500px;
        background:
          radial-gradient(760px 620px at 82% 45%, rgba(79, 140, 255, 0.34), transparent 60%),
          linear-gradient(120deg, #0b0f17 0%, #0d1526 55%, #0a1120 100%);
        color: #f5f8fe;
        font-family: "Helvetica Neue", "Inter", "Segoe UI", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      .copy {
        position: absolute;
        left: 68px;
        top: 50%;
        transform: translateY(-50%);
        width: 560px;
        z-index: 3;
      }
      .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 26px; }
      .brand img { width: 84px; height: 84px; border-radius: 21px; box-shadow: 0 10px 30px rgba(0,0,0,.55); }
      .brand b { font-size: 60px; font-weight: 800; letter-spacing: -2px; }
      .tag { font-size: 29px; font-weight: 500; line-height: 1.32; color: #b9c6dc; max-width: 520px; }
      .chips { margin-top: 26px; display: flex; gap: 12px; }
      .chips span {
        font-size: 19px; font-weight: 700; letter-spacing: 0.4px; color: #9fc0ff;
        border: 1px solid rgba(79,140,255,0.5); border-radius: 999px; padding: 7px 18px;
        background: rgba(79,140,255,0.12);
      }
      .stage {
        position: absolute;
        right: -14px;
        top: 50%;
        transform: translateY(-50%) rotate(-7deg);
        z-index: 2;
      }
      .phone {
        width: 288px; /* outer */
        padding: 9px;
        background: #04060a;
        border-radius: 40px;
        box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,0.06),
          0 18px 60px rgba(79,140,255,0.22);
      }
      .phone .screen { border-radius: 32px; overflow: hidden; line-height: 0; }
      .phone .screen img { width: 100%; display: block; }
      /* soft vertical fade so the bled phone melts into the panel top/bottom */
      .fade {
        position: absolute; right: 0; top: 0; width: 44%; height: 100%; z-index: 3;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(11,15,23,0.55) 0%, transparent 16% 84%, rgba(11,15,23,0.55) 100%);
      }
    </style>
  </head>
  <body>
    <div class="fg">
      <div class="copy">
        <div class="brand"><img src="./shots/app-icon.png" alt=""><b>Cast Anything</b></div>
        <div class="tag">Cast video, music &amp; photos from your phone to any TV on your Wi‑Fi.</div>
        <div class="chips"><span>NO CABLES</span><span>NO CHROMECAST</span></div>
      </div>
      <div class="stage">
        <div class="phone"><div class="screen"><img src="./shots/01-hero.png" alt=""></div></div>
      </div>
      <div class="fade"></div>
    </div>
  </body>
</html>
